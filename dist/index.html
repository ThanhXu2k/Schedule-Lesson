  function modal(title,subtitle,body){$('#modal-content').innerHTML='<div class="modal-header"><div><h2>'+title+'</h2><p>'+subtitle+'</p></div>'+btn('','close','close','ghost icon','aria-label="Close dialog"')+'</div><div class="modal-body">'+body+'<div id="modal-error" class="error-text" role="alert" hidden></div></div>';if(!$('#modal').open)$('#modal').showModal();}
  const formActions=label=>'<div class="form-actions">'+btn('Cancel','close',null)+'<button type="submit" class="primary">'+label+'</button></div>';
  function studentForm(id){const s=state.students.find(x=>x.student_id===id)||{status:'Active',timezone:state.settings.timezone,currency:state.settings.currency};modal(id?'Edit student':'A new learning journey','Student details are private to your workspace.','<form data-form="student"><input type="hidden" name="student_id" value="'+esc(id||'')+'"><div class="form-grid">'+input('Full name','full_name',s.full_name,'text','required maxlength="120"')+input('Email address','email',s.email,'email','required maxlength="254"')+zoneField(s.timezone)+select('Status','status',opts(['Active','Paused','Inactive'],s.status))+input('English level','english_level',s.english_level)+input('Phone number','phone',s.phone,'tel')+input('Start date','start_date',s.start_date,'date')+input('Hourly rate (optional)','hourly_rate',s.hourly_rate,'number','min="0" step="0.01"')+input('Currency','currency',s.currency,'text','maxlength="3" minlength="3" required')+input('Profile picture URL (optional)','profile_picture',s.profile_picture,'url','','Stored privately; initials are used in the interface.')+'<label class="field full"><span>Learning goals</span><textarea name="learning_goals">'+esc(s.learning_goals)+'</textarea></label><label class="field full"><span>Personal notes</span><textarea name="notes">'+esc(s.notes)+'</textarea></label>'+select('If pausing or archiving, future lessons…','future_policy',opts([['retain','Keep existing lessons'],['cancel','Cancel existing future lessons']], 'retain'),'Pausing stops new generation. Cancelling sends Calendar updates in live mode.')+'</div>'+formActions('Save student')+'</form>');}
  function studentDetail(id){const s=state.students.find(x=>x.student_id===id),slots=state.schedules.filter(x=>x.student_id===id);modal(esc(s.full_name),esc(s.email)+' · '+esc(s.timezone),'<div class="row between">'+pill(s.status)+btn('Edit profile','editStudent','edit','small','data-id="'+esc(id)+'"')+'</div><div class="detail-pairs"><div><dt>English level</dt><dd>'+esc(s.english_level||'Not set')+'</dd></div><div><dt>Completed lessons</dt><dd>'+state.lessons.filter(l=>l.student_id===id&&l.lesson_status==='Completed').length+'</dd></div></div><p class="tiny muted">'+esc(s.learning_goals||'Add learning goals in the student profile.')+'</p><hr><div class="section-header"><h3>Recurring lesson slots</h3>'+btn('Add slot','newSlot','plus','small','data-id="'+esc(id)+'"')+'</div>'+(slots.length?slots.map(x=>'<div class="slot-item"><div><strong>'+DAYS[x.day_of_week]+' · '+x.start_time+' · '+x.duration_minutes+' min</strong><small>Every '+x.recurrence_frequency+' week(s) · '+esc(x.timezone)+'</small><small>From '+esc(x.effective_start_date)+(x.effective_end_date?' to '+esc(x.effective_end_date):'')+' · '+esc(x.status)+'</small></div>'+btn('Edit','editSlot',null,'small','data-id="'+esc(x.schedule_id)+'"')+'</div>').join(''):empty('A regular rhythm starts here.','Add one or more weekly lesson slots.'))+'<div class="notice" style="margin-top:20px">'+icon('info')+'<span>Slot edits apply to ungenerated dates. Existing individual lessons keep their times. Reschedule or cancel those lessons separately.</span></div>');}
  function slotForm(studentId,id){const slot=state.schedules.find(x=>x.schedule_id===id),s=slot||{student_id:studentId,day_of_week:1,start_time:'18:00',duration_minutes:state.settings.default_duration,timezone:state.students.find(x=>x.student_id===studentId).timezone,effective_start_date:today(),status:'Active',recurrence_frequency:1,dst_fold:'earlier'};modal(id?'Edit recurring slot':'Set a weekly rhythm','This rule generates future lessons. Existing lessons are kept.','<form data-form="slot"><input type="hidden" name="schedule_id" value="'+esc(id||'')+'"><input type="hidden" name="student_id" value="'+esc(s.student_id)+'"><div class="form-grid">'+select('Day of week','day_of_week',opts(DAYS.map((x,i)=>[i,x]),s.day_of_week))+input('Start time','start_time',s.start_time,'time','required')+input('Duration (minutes)','duration_minutes',s.duration_minutes,'number','min="15" max="240" required')+zoneField(s.timezone)+input('Effective start date','effective_start_date',s.effective_start_date,'date','required')+input('End date (optional)','effective_end_date',s.effective_end_date,'date')+select('Repeat every','recurrence_frequency',opts([[1,'Week'],[2,'2 weeks'],[3,'3 weeks'],[4,'4 weeks']],s.recurrence_frequency))+select('Schedule status','status',opts(['Active','Paused'],s.status))+select('When clocks turn back','dst_fold',opts([['earlier','Use earlier occurrence'],['later','Use later occurrence']],s.dst_fold),'Nonexistent spring-forward times are skipped and logged.')+'</div>'+formActions('Save recurring slot')+'</form>');}
  function lessonForm(id){const l=lesson(id),p=l?S.parts(l.start_datetime,l.timezone):null;modal(l?'Reschedule this lesson':'Schedule a lesson',l?'Only this occurrence changes. The existing Calendar event is updated.':'One private event. One correct student.','<form data-form="lesson"><input type="hidden" name="lesson_id" value="'+esc(id||'')+'"><input type="hidden" name="revision" value="'+esc(l&&l.revision)+'"><div class="form-grid">'+(!l?select('Student','student_id',studentOptions('')):'<div class="field full"><span>Student</span><p>'+esc(l.student_name)+'</p></div>')+input('Lesson date','date',l?S.localDate(l.start_datetime,l.timezone):(cursor||today()),'date','required')+input('Start time','start_time',l?p.hour+':'+p.minute:'18:00','time','required')+input('Duration (minutes)','duration_minutes',l?l.duration_minutes:state.settings.default_duration,'number','min="15" max="240" required')+zoneField(l?l.timezone:state.settings.timezone)+select('If this time occurs twice','dst_fold',opts([['','Choose an offset if needed'],['earlier','Earlier occurrence'],['later','Later occurrence']],''))+'</div><div class="notice" style="margin-top:20px">'+icon('shield')+'<span>'+(state.mode==='live'?'Saving creates or updates a Google Calendar event and requests a student invitation.':'Development only. No Google events or invitations will be sent.')+'</span></div>'+formActions(l?'Save new time':'Schedule lesson')+'</form>');}
  function lessonDetail(id){const l=lesson(id),active=['Scheduled','Rescheduled'].includes(l.lesson_status);modal(esc(l.student_name),shortDate(l.start_datetime)+' · '+time(l.start_datetime)+'–'+time(l.end_datetime)+' · '+l.duration_minutes+' minutes','<div class="row wrap">'+pill(l.lesson_status)+pill(l.integration_mode==='mock'?'Simulated sync':l.sync_status)+'</div><dl class="detail-pairs"><div><dt>Lesson timezone</dt><dd>'+esc(l.timezone)+'</dd></div><div><dt>Student email snapshot</dt><dd>'+esc(l.student_email)+'</dd></div><div><dt>Invitation request</dt><dd>'+esc(l.invitation_status)+'</dd></div><div><dt>Student response</dt><dd>'+esc(l.attendee_response_status)+'</dd></div><div><dt>Google Meet</dt><dd>'+esc(l.integration_mode==='mock'?'Requires live Google connection':l.conference_status)+'</dd></div><div><dt>Original lesson start</dt><dd>'+shortDate(l.original_scheduled_start)+' · '+time(l.original_scheduled_start)+'</dd></div></dl>'+(l.last_error?'<div class="notice error">'+icon('info')+'<span>'+esc(l.last_error)+'. Review the Calendar event, then retry. Externally changed or deleted events require manual resolution; they are not recreated.</span></div>':'')+'<div class="actions">'+(l.google_meet_url&&l.conference_status==='Ready'&&l.lesson_status!=='Cancelled'?'<a href="'+esc(l.google_meet_url)+'" target="_blank" rel="noopener noreferrer">Join Meet '+icon('external')+'</a>':'')+(l.calendar_event_url?'<a href="'+safeUrl(l.calendar_event_url)+'" target="_blank" rel="noopener noreferrer">View Calendar event '+icon('external')+'</a>':'')+(active?btn('Reschedule','reschedule','edit','','data-id="'+esc(id)+'"')+btn('Cancel lesson','cancelLesson',null,'danger','data-id="'+esc(id)+'"'):'')+(['Failed','Conflict','Pending','Not Synced'].includes(l.sync_status)||l.conference_status==='Failed'?btn('Retry safely','retry','refresh','','data-id="'+esc(id)+'"'):'')+'</div><hr><form data-form="notes"><input type="hidden" name="lesson_id" value="'+esc(id)+'"><label class="field"><span>Lesson notes</span><textarea name="lesson_notes" maxlength="5000" placeholder="What did you cover? What comes next?">'+esc(l.lesson_notes)+'</textarea></label><div class="form-actions" style="margin-top:0;border:0">'+(l.lesson_status!=='Cancelled'&&l.start_datetime<=new Date().toISOString()&&!l.pending_action?select('Attendance','lesson_status',opts([['','Keep current status'],'Completed','Student Absent','Teacher Absent'],'')):'')+'<button type="submit" class="primary">Save notes & attendance</button></div></form>'+(l.change_history.length?'<h3>Time changes</h3>'+l.change_history.map(x=>'<p class="tiny muted" style="margin-top:10px">'+esc(x.original_start)+' → '+esc(x.start)+'</p>').join(''):'')+'<p class="tiny muted" style="margin-top:15px">Invitation status describes a request to Google. It does not confirm email delivery or that the student read it.</p>');}
  function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'&&['calendar.google.com','www.google.com'].includes(x.hostname)?esc(x.href):'#';}catch(_){return '#';}}
  async function openPreview(){if(busy)return;busy=true;$('#loading').hidden=false;try{previewData=await call('preview');const items=previewData.items,ready=items.filter(x=>x.result==='Ready').length,conflicts=items.filter(x=>x.result==='Conflict').length;modal('A look at next week',dateText(previewData.range.start)+' – '+dateText(previewData.range.end),'<div class="notice">'+icon('shield')+'<span>'+(state.mode==='live'?'Generating will create private Google events and request invitations to the associated students.':'Development preview. Generation simulates events without sending invitations.')+' Availability is checked again when you confirm.</span></div><div class="metric-grid"><div class="metric"><span>Ready to schedule</span><strong>'+ready+'</strong></div><div class="metric"><span>Conflicts</span><strong>'+conflicts+'</strong></div><div class="metric"><span>Already exists / skipped</span><strong>'+items.filter(x=>['Duplicate','Past'].includes(x.result)).length+'</strong></div></div><div class="preview-list">'+(items.length?items.map(x=>'<div class="preview-row"><div><strong>'+esc(x.student_name)+'</strong><small>'+esc(x.date)+(x.lesson?' · '+time(x.lesson.start_datetime)+' · '+x.lesson.duration_minutes+' min':'')+'</small>'+(x.conflicts&&x.conflicts.length?'<small>Busy: '+x.conflicts.map(c=>time(c.start)+'–'+time(c.end)).join(', ')+'. Choose another time manually.</small>':'')+(x.code?'<small>'+esc(x.code)+'</small>':'')+'</div>'+pill(x.result,x.result==='Ready'?'green':x.result==='Conflict'?'amber':'')+'</div>').join(''):empty('No eligible recurring lessons.','Add active recurring slots to active students first.'))+'</div><div class="form-actions">'+btn('Close','close',null)+btn('Generate '+ready+' lessons','confirmGenerate','bolt','primary',ready?'':'disabled')+'</div>');}catch(e){showError(e);}finally{busy=false;$('#loading').hidden=true;}}
  function confirmation(title,description,action,id,extra=''){modal(title,'Please review this action.','<p>'+description+'</p>'+extra+'<div class="form-actions">'+btn('Keep as is','close',null)+btn('Confirm','confirmed',null,'primary','data-action="'+action+'" '+(id?'data-id="'+esc(id)+'"':''))+'</div>');}
  function help(){modal('Your private teaching workspace','Google Apps Script + Google Sheets. No separate server.','<div class="notice">'+icon('info')+'<span>'+(GAS?'This app is running in Apps Script. Use Settings to test Calendar access and authorize live operations.':'This is the local development application. It uses browser storage and simulated calendar operations.')+'</span></div><div class="stack"><p><strong>1. Make it yours.</strong><br>Add students and their recurring weekly slots. Try a weekly preview to see conflicts and skipped duplicates.</p><p><strong>2. Deploy to Google.</strong><br>Follow the included README. Copy the four generated files from <code>apps-script/</code> into Apps Script, run <code>setup()</code>, and deploy with access restricted to yourself.</p><p><strong>3. Connect deliberately.</strong><br>Export and clear development lessons. Save your teaching calendar, test the connection, and enable live operations in Settings. Enable the weekly trigger separately.</p><p class="tiny muted">Core scheduling is free. Stay on Google’s no-cost Standard Tier with billing disabled. No credentials or tokens are stored in this browser.</p></div>');}
  function exportData(table,format){const map={Students:state.students,Lessons:state.lessons,RecurringSchedules:state.schedules,AutomationLogs:state.logs},rows=map[table];if(!rows)return;let body,type;if(format==='json'){body=JSON.stringify(rows,null,2);type='application/json';}else{const headers=Array.from(new Set(rows.flatMap(x=>Object.keys(x))));const cell=x=>{let v=typeof x==='object'?JSON.stringify(x):String(x==null?'':x);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};body='\uFEFF'+[headers.map(cell).join(',')].concat(rows.map(x=>headers.map(h=>cell(x[h])).join(','))).join('\r\n');type='text/csv;charset=utf-8';}const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=table+'-'+today()+'.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export downloaded.');}
  document.addEventListener('click',async event=>{
    const target=event.target.closest('[data-act]');if(!target||target.disabled)return;const action=target.dataset.act,id=target.dataset.id;
    try{switch(action){
      case 'nav':navigate(target.dataset.route);break;case 'goSchedule':navigate('Schedule');break;case 'goSettings':navigate('Settings');break;
      case 'sidebar':if(innerWidth<=720)document.body.classList.toggle('menu-open');else{document.body.classList.toggle('collapsed');localStorage.setItem('teaching-scheduler.collapsed',document.body.classList.contains('collapsed'));}break;
      case 'theme':localStorage.setItem('teaching-scheduler.theme',document.documentElement.dataset.theme==='dark'?'Light':'Dark');applyTheme();break;
      case 'help':help();break;case 'close':$('#modal').close();break;case 'newStudent':studentForm();break;case 'editStudent':studentForm(id);break;case 'student':studentDetail(id);break;case 'newSlot':slotForm(id);break;case 'editSlot':slotForm(null,id);break;case 'newLesson':lessonForm();break;case 'lesson':lessonDetail(id);break;case 'reschedule':lessonForm(id);break;
      case 'clearFilters':filter={search:'',student:'',status:'',from:'',to:'',month:''};render();break;case 'view':calendarView=target.dataset.view;render();break;case 'today':cursor=today();render();break;
      case 'prevDate':case 'nextDate':{const n=action==='prevDate'?-1:1;if(calendarView==='Month'){const x=new Date((cursor||today()).slice(0,7)+'-15T12:00Z');x.setUTCMonth(x.getUTCMonth()+n);cursor=x.toISOString().slice(0,7)+'-01';}else cursor=S.dayAdd(cursor||today(),n*(calendarView==='Week'?7:calendarView==='List'?28:1));render();break;}
      case 'preview':await openPreview();break;case 'confirmGenerate':{const log=await operation('generate',{confirm:true,range:previewData.range},'Weekly generation finished.');if(log){navigate('Automation Logs');if(log.failed_lessons||log.conflicting_lessons)toast('Generation finished with items to review.',true);}break;}
      case 'retry':{const l=await operation('retry',{lesson_id:id},'Lesson synchronization checked.');if(l)lessonDetail(id);break;}
      case 'cancelLesson':confirmation('Cancel this lesson?','The occurrence will be kept as cancelled. '+(state.mode==='live'?'Google Calendar will be asked to notify the associated student.':'No real invitation will be sent.'),'cancel',id);break;
      case 'clearDevelopment':confirmation('Clear development lessons?','This removes simulated lessons and automation logs. Students and recurring slots are retained. Export the records first.','clearDevelopment');break;
      case 'disableLive':confirmation('Disable live operations?','This also removes the weekly trigger. Existing Google events and lesson records are retained.','disableLive');break;
      case 'enableLive':if(!GAS){help();break;}confirmation('Authorize live Calendar operations','New lessons can create Google Calendar events, generate Google Meet conferences, and request invitations to students. Export and clear development lessons first.','enableLive',null,'<label class="switch-row" style="margin-top:20px"><input type="checkbox" id="free-tier-confirmed"> I verified Standard Tier with billing disabled.</label>');break;
      case 'toggleAutomation':if(state.settings.automation_enabled)await operation('disableAutomation',{},'Weekly automation disabled.');else if(!GAS)help();else confirmation('Enable weekly automation?','A weekly Google trigger will generate lessons and request student invitations while your computer is off. An hourly status check will retrieve pending Meet links. Save settings and preview the schedule first.','enableAutomation');break;
      case 'confirmed':{const act=target.dataset.action,values=act==='cancel'?{lesson_id:id}:{confirm:true};if(act==='enableLive')values.free_tier_confirmed=!!$('#free-tier-confirmed')?.checked;await operation(act,values,act==='cancel'?'Lesson cancelled.':'Workspace updated.');break;}
      case 'calendars':{if(!GAS){help();break;}const values=await operation('calendars',{},'Calendars loaded.',false);if(values){calendarChoices=values;render();}break;}
      case 'testConnection':if(!GAS)help();else await operation('testConnection',{},'Calendar connection and Google Meet support verified.',false);break;
      case 'reconcile':await operation('reconcile',{},state.mode==='live'?'Calendar statuses refreshed.':'Simulated calendar statuses refreshed.');break;
      case 'export':exportData(target.dataset.table,target.dataset.format);break;
      case 'log':{const l=state.logs.find(x=>x.execution_id===id);modal('Execution details',esc(l.execution_id),'<div class="row wrap">'+pill(l.execution_status)+'<span class="tiny muted">'+esc(l.trigger_type)+' · '+l.total_lessons+' eligible lessons</span></div><hr><pre class="log-detail">'+esc(JSON.stringify(l.error_details,null,2))+'</pre><p class="tiny muted" style="margin-top:15px">Errors contain record IDs and status codes, without Google credentials. Failed lesson records are available in the attention list below.</p>');break;}
    }}catch(e){showError(e);}
  });
  document.addEventListener('submit',async event=>{
    const form=event.target;event.preventDefault();if(busy)return;const data=Object.fromEntries(new FormData(form).entries());let action,message;
    if(form.id==='settings-form'){action='saveSettings';data.conflict_calendars=data.conflict_calendars.split('\n').map(x=>x.trim()).filter(Boolean);data.reminder_minutes=data.reminder_minutes.split(',').map(x=>x.trim()).filter(Boolean).map(Number);data.reminders_enabled=!!form.elements.reminders_enabled.checked;message='Workspace settings saved.';}
    else if(form.dataset.form==='student'){action='saveStudent';message='Student saved.';}
    else if(form.dataset.form==='slot'){action='saveSchedule';message='Recurring slot saved. Existing lessons keep their times.';}
    else if(form.dataset.form==='lesson'){action=data.lesson_id?'reschedule':'createLesson';message=data.lesson_id?'Lesson time updated.':'Lesson scheduled.';}
    else if(form.dataset.form==='notes'){action=data.lesson_status?'attend':'notes';message='Lesson notes and attendance saved.';}else return;
    const result=await operation(action,data,message);
    if(result&&action==='saveSettings'){localStorage.setItem('teaching-scheduler.theme',data.theme);applyTheme();}
    if(result&&action==='saveStudent'){studentDetail(result.student.student_id);if(result.future_results.some(x=>x.status==='Failed'))toast('Student saved. Some cancellations need retry in Automation Logs.',true);}
    if(result&&action==='saveSchedule')studentDetail(result.student_id);
  });
  let searchTimer;
  document.addEventListener('input',event=>{const key=event.target.dataset.filter;if(!key||key!=='search')return;clearTimeout(searchTimer);const value=event.target.value,start=event.target.selectionStart;searchTimer=setTimeout(()=>{filter[key]=value;render();const input=$('[data-filter="search"]');if(input){input.focus();input.setSelectionRange(start,start);}},180);});
  document.addEventListener('change',event=>{const key=event.target.dataset.filter;if(key&&key!=='search'){filter[key]=event.target.value;render();}});
  $('#modal').addEventListener('click',event=>{if(event.target===$('#modal')){const box=$('#modal').getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)$('#modal').close();}});
  window.addEventListener('storage',async event=>{if(event.key===KEY&&!busy){state=await call('snapshot');render();}});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>state&&applyTheme());
  (async()=>{try{state=await call('snapshot');if(localStorage.getItem('teaching-scheduler.collapsed')==='true')document.body.classList.add('collapsed');render();}catch(e){$('#main').innerHTML='<div class="empty"><h1>Your workspace needs attention.</h1><p>'+esc(e.message)+'</p><p>For Apps Script, run setup() in the editor and verify owner-only deployment.</p></div>';}})();
})();
</script>
